services:
  db:
    image: postgres:16-alpine
    container_name: polza_db
    environment:
      POSTGRES_USER: polza
      POSTGRES_PASSWORD: polza
      POSTGRES_DB: polza
    ports:
      - "5432:5432"
    volumes:
      - polza_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polza -d polza"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  polza_pgdata:
